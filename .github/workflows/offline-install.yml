name: Offline installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu:24.04, debian:trixie]
    container: ${{ matrix.image }}
    steps:
      - name: Prepare OS prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make python3 python3-venv libpcsclite1
      - uses: actions/checkout@v4
      - name: Install committed wheels and run tests
        run: make -C homelab_secrets test
