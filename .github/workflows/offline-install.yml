name: Offline installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Validate the complete dependency upgrade command
        run: make -C homelab_secrets build-upgrade
