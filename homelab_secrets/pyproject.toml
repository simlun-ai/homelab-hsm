[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-secrets"
version = "0.1.0"
description = "YubiKey-backed homelab wrapped records"
requires-python = ">=3.10,<3.15"
dependencies = ["cryptography==50.0.1", "yubikey-manager==5.9.2"]

[project.scripts]
homelab-wrap = "homelab_secrets.cli:wrap_main"
homelab-unwrap = "homelab_secrets.cli:unwrap_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "scripts"]
line-length = 88
required-version = "==0.17.2"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
